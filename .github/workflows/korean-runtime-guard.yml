name: Korean runtime guard

on:
  push:
    branches:
      - master
    paths:
      - apps/openmw/mwdialogue/dialoguemanagerimp.cpp
      - apps/openmw/mwdialogue/journalentry.cpp
      - apps/openmw/mwdialogue/keywordsearch.cpp
      - apps/openmw/mwdialogue/keywordsearch.hpp
      - apps/openmw/mwgui/videowidget.cpp
      - apps/openmw/mwgui/videowidget.hpp
      - components/esm3/esmreader.cpp
      - components/translation/translation.cpp
      - korean/patches/**
      - apps/openmw/mwgui/journalviewmodel.cpp
      - components/translation/translation.hpp
      - packaging/korean/tooling/**
      - .github/workflows/korean-runtime-guard.yml
  pull_request:
    branches:
      - master
    paths:
      - apps/openmw/mwdialogue/dialoguemanagerimp.cpp
      - apps/openmw/mwdialogue/journalentry.cpp
      - apps/openmw/mwdialogue/keywordsearch.cpp
      - apps/openmw/mwdialogue/keywordsearch.hpp
      - apps/openmw/mwgui/videowidget.cpp
      - apps/openmw/mwgui/videowidget.hpp
      - components/esm3/esmreader.cpp
      - components/translation/translation.cpp
      - korean/patches/**
      - apps/openmw/mwgui/journalviewmodel.cpp
      - components/translation/translation.hpp
      - packaging/korean/tooling/**
      - .github/workflows/korean-runtime-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-korean-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source-equivalent Korean patches are present
        run: |
          set -euo pipefail
          git config core.autocrlf false
          # 0005 targets the clean upstream openmw-0.51.0 VideoWidget, while this fork's
          # VideoWidget also carries unrelated source differences. Its upstream apply/build
          # validation is handled by the manual korean-windows-port.yml build against the target upstream ref; source equivalence is guarded below.
          for patch in \
            korean/patches/0001-cjk-topic-discovery.patch \
            korean/patches/0002-utf8-bom-sidecars.patch \
            korean/patches/0003-mixed-utf8-esm-reader.patch \
            korean/patches/0004-legacy-korean-journal-recovery.patch \
            korean/patches/0006-journal-topic-keywords.patch \
            korean/patches/0007-korean-journal-index.patch; do
            echo "Reverse-checking $patch"
            git apply --reverse --check "$patch"
          done
          test -s korean/patches/0005-video-subtitles.patch

      - name: Verify Korean runtime invariants
        run: |
          set -euo pipefail
          grep -F 'parseHyperText(text, mTranslationDataStorage, true)' apps/openmw/mwdialogue/dialoguemanagerimp.cpp
          grep -F 'bool overlaps = false' apps/openmw/mwdialogue/keywordsearch.hpp
          grep -F 'static_cast<unsigned char>(*i) < 0xe0' apps/openmw/mwdialogue/keywordsearch.cpp
          grep -F 'std::ios::binary' components/translation/translation.cpp
          grep -F 'utf8BomMode ? std::string_view(line)' components/translation/translation.cpp
          grep -F 'bool isValidUtf8WithHangul(std::string_view input)' components/esm3/esmreader.cpp
          grep -F 'if (isValidUtf8WithHangul(raw))' components/esm3/esmreader.cpp
          grep -F 'void recoverLegacyKoreanJournalText(' apps/openmw/mwdialogue/journalentry.cpp
          grep -F 'recoverLegacyKoreanJournalText(record.mTopic, record.mInfo, mText, mActorName);' apps/openmw/mwdialogue/journalentry.cpp
          grep -F 'loadSubtitles(video);' apps/openmw/mwgui/videowidget.cpp
          grep -F 'subtitlePath = video.substr(0, dot) + ".srt";' apps/openmw/mwgui/videowidget.cpp
          grep -F 'mPlayer->getCurrentTime()' apps/openmw/mwgui/videowidget.cpp
          grep -F 'translationStorage.journalKeywords(topic.getName())' apps/openmw/mwgui/journalviewmodel.cpp
          grep -F 'loadData(mJournalKeywords, esmNameNoExtension, "jrn", dataFileCollections);' components/translation/translation.cpp

      - name: Verify journal links with the real parser and sidecar loader
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -I. \
            packaging/korean/tooling/verify-journal-links.cpp \
            apps/openmw/mwdialogue/keywordsearch.cpp \
            components/translation/translation.cpp \
            components/files/collections.cpp \
            components/files/multidircollection.cpp \
            components/files/conversion.cpp \
            components/toutf8/toutf8.cpp \
            components/debug/debuglog.cpp \
            -o /tmp/verify-journal-links
          python3 packaging/korean/tooling/test_journal_links.py /tmp/verify-journal-links

      - name: Verify Korean journal index groups
        run: |
          g++ -std=c++20 -O2 -I. packaging/korean/tooling/test-journal-index.cpp -o /tmp/test-journal-index
          /tmp/test-journal-index
          g++ -std=c++20 -O2 -I. packaging/korean/tooling/test-legacy-korean-name.cpp -o /tmp/test-legacy-korean-name
          /tmp/test-legacy-korean-name

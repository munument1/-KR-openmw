name: Add My Games OpenMW cfg to KR1 release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/add-user-cfg-to-kr1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Add user cfg folder to KR1 asset
        env:
          GH_TOKEN: ${{ github.token }}
          CFG_GZ_B64: 
        run: |
          set -euo pipefail
          ASSET='Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip'
          mkdir -p /tmp/kr1
          cd /tmp/kr1
          gh release download openmw-0.51.0-kr1 --repo "$GITHUB_REPOSITORY" --pattern "$ASSET"
          rm -rf extracted
          mkdir extracted
          unzip -q "$ASSET" -d extracted

          find extracted -maxdepth 1 -type d -iname 'CFG*' -prune -exec rm -rf {} +
          CFG_DIR='extracted/CFG - 내문서 My Games OpenMW에 덮어쓰기'
          mkdir -p "$CFG_DIR"
          printf '%s' "$CFG_GZ_B64" | base64 -d | gzip -dc > "$CFG_DIR/openmw.cfg"

          tail -n 5 "$CFG_DIR/openmw.cfg"
          grep -Fx 'fallback=Fonts_Font_0,MysticCards' "$CFG_DIR/openmw.cfg"
          grep -Fx 'fallback=Fonts_Font_1,DejaVuLGCSansMono' "$CFG_DIR/openmw.cfg"
          grep -Fx 'fallback=Fonts_Font_2,DemonicLetters' "$CFG_DIR/openmw.cfg"
          test "$(tail -n 1 "$CFG_DIR/openmw.cfg")" = 'encoding=win1252'
          if find extracted -type f \( -iname 'MysticCards.fnt' -o -iname 'MysticCards.tex' -o -iname 'magic_cards_regular.fnt' -o -iname 'DemonicLetters.fnt' -o -iname 'DemonicLetters.tex' -o -iname 'daedric_font.fnt' \) | grep -q .; then
            echo 'ERROR: legacy bitmap font still present'
            exit 1
          fi

          rm -f "$ASSET"
          (cd extracted && zip -qr9 ../"$ASSET" .)
          unzip -tq "$ASSET"
          unzip -Z1 "$ASSET" | grep -F 'CFG - 내문서 My Games OpenMW에 덮어쓰기/openmw.cfg'
          sha256sum "$ASSET"
          stat -c '%s bytes' "$ASSET"
          gh release upload openmw-0.51.0-kr1 "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

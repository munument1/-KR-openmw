name: Rollback KR2 video regression

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/rollback-kr2-video-regression.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: openmw-0.51.0-kr2
      ASSET: Morrowind-Korean-OpenMW-0.51.0-KR2-Full.zip
      ENGINE_RUN: "34072037180"
      ENGINE_ARTIFACT: korean-openmw-0.51-targeted-07caf726543c5f69639ffd97ad34260ec8ea03e4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore known-good pre-subtitle engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work/base work/pkg work/engine out

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir work/base --clobber
          unzip -q "work/base/$ASSET" -d work/pkg

          gh run download "$ENGINE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ENGINE_ARTIFACT" --dir work/engine
          engine=$(find work/engine -type f -name openmw.exe -print -quit)
          test -n "$engine"
          install -m 0755 "$engine" work/pkg/payload/openmw.exe

          # Keep the translation/font/install payload intact, but remove subtitle files until the runtime regression is fixed.
          rm -rf work/pkg/payload/mods/Morrowind_Korean_ReTranslation/video
          rm -f work/pkg/VIDEO-SUBTITLES-README.txt

          # Use an installer that does not require the temporarily disabled subtitle files.
          python3 - <<'PY'
          from pathlib import Path
          src = Path('packaging/korean/install-korean.ps1').read_text(encoding='utf-8')
          start = src.find('$requiredSubtitleFiles = @(')
          if start != -1:
              end = src.find('$payloadMod = ', start)
              if end == -1:
                  raise SystemExit('failed to locate subtitle block end')
              src = src[:start] + src[end:]
          src = src.replace('$payloadSubtitles = Join-Path $payloadMod "video"\n', '')
          marker = 'foreach ($requiredSubtitleFile in $requiredSubtitleFiles) {'
          start = src.find(marker)
          if start != -1:
              end = src.find('if (-not (Test-Path -LiteralPath $configUpdater -PathType Leaf)) {', start)
              if end == -1:
                  raise SystemExit('failed to locate subtitle validation block end')
              src = src[:start] + src[end:]
          Path('work/pkg/install-korean.ps1').write_text(src, encoding='utf-8')
          PY

          test -f work/pkg/payload/openmw.exe
          test -f work/pkg/payload/mods/Morrowind_Korean_ReTranslation/Morrowind_Korean_ReTranslation.esp
          test ! -d work/pkg/payload/mods/Morrowind_Korean_ReTranslation/video

          (
            cd work/pkg
            zip -q -r "../../out/$ASSET" .
          )
          sha256sum "out/$ASSET" | sed 's#out/##' > "out/$ASSET.sha256"
          unzip -t "out/$ASSET" >/dev/null

      - name: Publish rollback
        shell: bash
        run: |
          set -euo pipefail
          cat > out/release-notes.md <<'EOF'
          # OpenMW 0.51.0 Korean Support KR2

          OpenMW 0.51.0용 모로윈드 한국어 통합 지원 패키지입니다.

          ## KR2 통합 구성
          - `Install-Korean.bat` 원클릭 설치
          - 한국어 런타임 패치가 적용된 `openmw.exe`
          - Gowun Batang 기반 한국어 폰트 구성
          - 번역 데이터 `ESP / CEL / MRK / TOP / l10n` 포함
          - 기존 설정과 모드 순서를 보존하는 `openmw.cfg` 자동 갱신
          - 이전 한국어 패치 폴더/엔진 자동 백업

          ## 영상 자막 상태
          영상 자막 기능을 추가한 엔진에서 영상 재생 회귀가 확인되어, 현재 공개 KR2는 자막 기능 추가 전의 검증된 엔진으로 롤백했습니다. 원본 영상 재생 안정성을 우선 복구한 상태입니다.

          자막 기능은 영상 재생 경로를 건드리지 않는 방식으로 다시 구현한 뒤 재배포할 예정입니다.

          ## 설치
          1. 공식 OpenMW 0.51.0을 설치하고 한 번 실행합니다.
          2. 이 릴리즈의 `Morrowind-Korean-OpenMW-0.51.0-KR2-Full.zip`을 압축 해제합니다.
          3. `Install-Korean.bat`을 실행합니다.

          전역 `encoding=utf8` 설정은 필요하지 않습니다.
          EOF

          gh release upload "$TAG" "out/$ASSET" "out/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenMW 0.51.0 Korean Support KR2" --notes-file out/release-notes.md

      - name: Verify rollback asset
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(cut -d' ' -f1 "out/$ASSET.sha256")
          remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == env.ASSET) | .digest')
          test "$remote_digest" = "sha256:$local_sha"
          echo "Rolled back $ASSET with $remote_digest"

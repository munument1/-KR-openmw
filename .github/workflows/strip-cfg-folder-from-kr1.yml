name: Strip CFG folder from KR1 release

on:
  push:
    paths:
      - .github/workflows/strip-cfg-folder-from-kr1.yml

permissions:
  contents: write

jobs:
  patch-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TAG: openmw-0.51.0-kr1
      ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Remove CFG folder entirely from release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kr1-no-cfg-folder"
          original="$root/original"
          unpacked="$root/unpacked"
          patched="$root/$ASSET"
          mkdir -p "$original" "$unpacked"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$original"
          unzip -q "$original/$ASSET" -d "$unpacked"

          echo 'CFG-named paths before cleanup:'
          find "$unpacked" -ipath '*/CFG*' -print | sed "s#^$unpacked/##" | sort || true

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'kr1-no-cfg-folder' / 'unpacked'
          targets = []
          for p in root.rglob('*'):
              if p.is_dir() and p.name.casefold().startswith('cfg'):
                  targets.append(p)
          for p in sorted(targets, key=lambda x: len(x.parts), reverse=True):
              if p.exists():
                  print(f'Removing CFG directory tree: {p.relative_to(root)}')
                  shutil.rmtree(p)
          for p in list(root.rglob('*.cfg')):
              if p.exists():
                  print(f'Removing stray cfg file: {p.relative_to(root)}')
                  p.unlink()
          PY

          font_def="$(find "$unpacked" -type f -name 'MysticCards.omwfont' -print -quit)"
          test -n "$font_def"
          font_dir="$(dirname "$font_def")"
          grep -q 'Source" value="NanumGothic-Regular.ttf"' "$font_def"
          grep -q '44032 55203' "$font_def"
          test -s "$font_dir/NanumGothic-Regular.ttf"

          (cd "$unpacked" && zip -qr -9 -D "$patched" .)
          unzip -tq "$patched"

          if unzip -Z1 "$patched" | grep -Ei '(^|/)CFG[^/]*/'; then
            echo 'CFG directory still present in final ZIP' >&2
            exit 1
          fi
          if unzip -Z1 "$patched" | grep -Ei '(^|/)[^/]+\.cfg$'; then
            echo 'CFG file still present in final ZIP' >&2
            exit 1
          fi

          echo 'Final ZIP contains no CFG folder and no .cfg files.'
          echo "Patched asset SHA-256: $(sha256sum "$patched" | awk '{print $1}')"

          gh release upload "$TAG" "$patched" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == env.ASSET) | {name,size,updatedAt,digest}'

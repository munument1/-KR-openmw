name: Port validated Korean runtime support

on:
  push:
    branches:
      - korean-support
    paths:
      - korean/patches/**
      - .github/workflows/port-korean-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validated-runtime-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout korean-support
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve source bytes
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Apply validated Korean runtime patches
        run: |
          set -euo pipefail
          patches=(
            korean/patches/0001-cjk-topic-discovery.patch
            korean/patches/0002-utf8-bom-sidecars.patch
            korean/patches/0003-mixed-utf8-esm-reader.patch
          )
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Gate source scope and invariants
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(cat <<'EOF'
          apps/openmw/mwdialogue/dialoguemanagerimp.cpp
          apps/openmw/mwdialogue/keywordsearch.cpp
          apps/openmw/mwdialogue/keywordsearch.hpp
          components/esm3/esmreader.cpp
          components/translation/translation.cpp
          EOF
          )"
          test "$changed" = "$expected"
          grep -F 'parseHyperText(text, mTranslationDataStorage, true)' apps/openmw/mwdialogue/dialoguemanagerimp.cpp
          grep -F 'bool overlaps = false' apps/openmw/mwdialogue/keywordsearch.hpp
          grep -F 'std::ios::binary' components/translation/translation.cpp
          grep -F 'utf8BomMode ? std::string_view(line)' components/translation/translation.cpp
          grep -F 'bool isValidUtf8WithHangul(std::string_view input)' components/esm3/esmreader.cpp
          grep -F 'if (isValidUtf8WithHangul(raw))' components/esm3/esmreader.cpp

      - name: Commit ported source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/openmw/mwdialogue/dialoguemanagerimp.cpp \
            apps/openmw/mwdialogue/keywordsearch.cpp \
            apps/openmw/mwdialogue/keywordsearch.hpp \
            components/esm3/esmreader.cpp \
            components/translation/translation.cpp
          git commit -m 'Port validated Korean runtime support'
          git push origin HEAD:korean-support

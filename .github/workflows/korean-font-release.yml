name: Korean Font Release Updater

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/korean-font-release.yml

permissions:
  contents: write

jobs:
  update-korean-font:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TAG: openmw-0.51.0-kr1
      ASSET: Morrowind-Korean-OpenMW-0.51.0-KR1-Full.zip
      FONT_URL: https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Regular.ttf
      LICENSE_URL: https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/OFL.txt
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install Korean TrueType font definition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/data/fonts
          curl -fL --retry 3 "$FONT_URL" -o files/data/fonts/NanumGothic-Regular.ttf
          curl -fL --retry 3 "$LICENSE_URL" -o files/data/fonts/NanumGothicFontLicense.txt
          test "$(stat -c%s files/data/fonts/NanumGothic-Regular.ttf)" -gt 2000000
          cat > files/data/fonts/MysticCards.omwfont <<'EOF'
          <MyGUI type="Resource" version="1.1">
              <Resource type="ResourceTrueTypeFont">
                  <Property key="Source" value="NanumGothic-Regular.ttf"/>
                  <Property key="Antialias" value="false"/>
                  <Property key="SubstituteCode" value="95"/>
                  <Property key="TabWidth" value="8"/>
                  <Property key="OffsetHeight" value="0"/>
                  <Property key="Resolution" value="70"/>
                  <Codes>
                      <Code range="33 126"/>
                      <Code range="160 161"/>
                      <Code range="173"/>
                      <Code range="175 177"/>
                      <Code range="180"/>
                      <Code range="191 382"/>
                      <Code range="711"/>
                      <Code range="1025"/>
                      <Code range="1040 1103"/>
                      <Code range="1105"/>
                      <Code range="4352 4607"/>
                      <Code range="7838"/>
                      <Code range="8208 8212"/>
                      <Code range="8216 8217"/>
                      <Code range="8220 8221"/>
                      <Code range="8228 8230"/>
                      <Code range="12288 12351"/>
                      <Code range="12593 12686"/>
                      <Code range="44032 55203"/>
                  </Codes>
              </Resource>
          </MyGUI>
          EOF
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('files/data/fonts/MysticCards.omwfont')
          print('MysticCards.omwfont XML OK')
          PY

      - name: Commit bundled Korean font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/data/fonts/MysticCards.omwfont \
                  files/data/fonts/NanumGothic-Regular.ttf \
                  files/data/fonts/NanumGothicFontLicense.txt
          if ! git diff --cached --quiet; then
            git commit -m "Bundle Korean font for MysticCards"
            git push origin HEAD:master
          fi

      - name: Patch existing KR1 release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/korean-font-release"
          original="$root/original"
          unpacked="$root/unpacked"
          patched="$root/$ASSET"
          mkdir -p "$original" "$unpacked"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$original"
          unzip -q "$original/$ASSET" -d "$unpacked"

          font_def="$(find "$unpacked" -type f -name 'MysticCards.omwfont' -print -quit)"
          if [[ -z "$font_def" ]]; then
            echo "MysticCards.omwfont not found in release asset" >&2
            exit 1
          fi
          font_dir="$(dirname "$font_def")"
          cp files/data/fonts/MysticCards.omwfont "$font_dir/MysticCards.omwfont"
          cp files/data/fonts/NanumGothic-Regular.ttf "$font_dir/NanumGothic-Regular.ttf"
          cp files/data/fonts/NanumGothicFontLicense.txt "$font_dir/NanumGothicFontLicense.txt"

          grep -q 'Source" value="NanumGothic-Regular.ttf"' "$font_dir/MysticCards.omwfont"
          grep -q '44032 55203' "$font_dir/MysticCards.omwfont"
          test -s "$font_dir/NanumGothic-Regular.ttf"

          (cd "$unpacked" && zip -qr -9 "$patched" .)
          unzip -tq "$patched"
          echo "Patched asset SHA-256: $(sha256sum "$patched" | awk '{print $1}')"
          echo "Font definition path: ${font_def#$unpacked/}"

          gh release upload "$TAG" "$patched" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == env.ASSET) | {name,size,updatedAt,digest}'

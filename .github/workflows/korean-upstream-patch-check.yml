name: Korean upstream patch check

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: OpenMW upstream branch, tag, or commit to test
        required: false
        default: master
        type: string

permissions:
  contents: read

jobs:
  check-patchset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean fork
        uses: actions/checkout@v4

      - name: Fetch requested upstream ref
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          ref="${UPSTREAM_REF:-master}"
          git remote add upstream https://github.com/OpenMW/openmw.git
          git fetch --no-tags --depth=1 upstream "$ref"
          git worktree add --detach "$RUNNER_TEMP/openmw-upstream" FETCH_HEAD
          echo "Testing Korean patches against upstream ref: $ref"
          git -C "$RUNNER_TEMP/openmw-upstream" rev-parse HEAD

      - name: Check and apply Korean runtime patches
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/openmw-upstream"
          for patch in \
            "$GITHUB_WORKSPACE/korean/patches/0001-cjk-topic-discovery.patch" \
            "$GITHUB_WORKSPACE/korean/patches/0002-utf8-bom-sidecars.patch" \
            "$GITHUB_WORKSPACE/korean/patches/0003-mixed-utf8-esm-reader.patch" \
            "$GITHUB_WORKSPACE/korean/patches/0004-legacy-korean-journal-recovery.patch"; do
            echo "Checking $(basename "$patch")"
            git -C "$target" apply --check "$patch"
            git -C "$target" apply "$patch"
          done

      - name: Verify patched runtime invariants
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/openmw-upstream"
          grep -F 'parseHyperText(text, mTranslationDataStorage, true)' "$target/apps/openmw/mwdialogue/dialoguemanagerimp.cpp"
          grep -F 'bool overlaps = false' "$target/apps/openmw/mwdialogue/keywordsearch.hpp"
          grep -F 'static_cast<unsigned char>(*i) < 0xe0' "$target/apps/openmw/mwdialogue/keywordsearch.cpp"
          grep -F 'std::ios::binary' "$target/components/translation/translation.cpp"
          grep -F 'utf8BomMode ? std::string_view(line)' "$target/components/translation/translation.cpp"
          grep -F 'bool isValidUtf8WithHangul(std::string_view input)' "$target/components/esm3/esmreader.cpp"
          grep -F 'if (isValidUtf8WithHangul(raw))' "$target/components/esm3/esmreader.cpp"
          grep -F 'void recoverLegacyKoreanJournalText(' "$target/apps/openmw/mwdialogue/journalentry.cpp"
          grep -F 'recoverLegacyKoreanJournalText(mTopic, mInfoId, mText);' "$target/apps/openmw/mwdialogue/journalentry.cpp"

      - name: Show patched files
        run: |
          git -C "$RUNNER_TEMP/openmw-upstream" status --short

name: Publish KR2 subtitle refresh

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-kr2-subtitle-refresh.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: openmw-0.51.0-kr2
      ASSET: Morrowind-Korean-OpenMW-0.51.0-KR2-Full.zip
      ENGINE_RUN: "34099111292"
      ENGINE_ARTIFACT: korean-openmw-0.51-targeted-904a587f86eb4634109c50ac301fcf32cdb74375
      MOD_DIR: payload/mods/Morrowind_Korean_ReTranslation
    steps:
      - name: Checkout current KR2 source
        uses: actions/checkout@v6

      - name: Rebuild integrated KR2 package from published payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work/base work/pkg work/engine out

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir work/base --clobber
          unzip -q "work/base/$ASSET" -d work/pkg

          gh run download "$ENGINE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ENGINE_ARTIFACT" --dir work/engine
          engine=$(find work/engine -type f -name openmw.exe -print -quit)
          test -n "$engine"
          install -m 0755 "$engine" work/pkg/payload/openmw.exe

          install -m 0644 packaging/korean/install-korean.ps1 work/pkg/install-korean.ps1
          install -m 0644 packaging/korean/install-korean-config.ps1 work/pkg/install-korean-config.ps1

          mkdir -p "work/pkg/$MOD_DIR/video"
          rm -f "work/pkg/$MOD_DIR/video"/*.srt
          install -m 0644 korean/subtitles/video/*.srt "work/pkg/$MOD_DIR/video/"

          cat > work/pkg/VIDEO-SUBTITLES-README.txt <<'EOF'
          Korean video subtitles for OpenMW 0.51.0 KR2

          The Korean runtime patch automatically looks for a UTF-8 SRT file with the same VFS basename as each BIK video.
          Example: video\\mw_intro.bik -> video\\mw_intro.srt

          Included subtitles:
          - Morrowind: mw_intro, mw_cavern, mw_end
          - Bloodmoon: bm_bearhunt1, bm_bearhunt2, bm_ceremony1, bm_ceremony2, bm_endgame, bm_frostgiant1, bm_frostgiant2

          Original BIK files are not redistributed.
          EOF
          sed -i 's/^          //' work/pkg/VIDEO-SUBTITLES-README.txt

          test -f "work/pkg/$MOD_DIR/Morrowind_Korean_ReTranslation.esp"
          test -f "work/pkg/$MOD_DIR/Morrowind_Korean_ReTranslation.cel"
          test -f "work/pkg/$MOD_DIR/Morrowind_Korean_ReTranslation.mrk"
          test -f "work/pkg/$MOD_DIR/Morrowind_Korean_ReTranslation.top"
          test -d "work/pkg/$MOD_DIR/l10n"
          test "$(find "work/pkg/$MOD_DIR/video" -maxdepth 1 -type f -name '*.srt' | wc -l)" -eq 10
          test -f work/pkg/payload/openmw.exe

          (
            cd work/pkg
            zip -q -r "../../out/$ASSET" .
          )
          sha256sum "out/$ASSET" | sed 's#out/##' > "out/$ASSET.sha256"
          unzip -t "out/$ASSET" >/dev/null
          cat "out/$ASSET.sha256"

      - name: Replace KR2 release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          cat > out/release-notes.md <<'EOF'
          # OpenMW 0.51.0 Korean Support KR2

          OpenMW 0.51.0용 모로윈드 한국어 통합 지원 패키지입니다.

          ## KR2 통합 구성
          - `Install-Korean.bat` 원클릭 설치
          - 한국어 런타임 패치가 적용된 `openmw.exe`
          - Gowun Batang 기반 한국어 폰트 구성
          - 번역 데이터 `ESP / CEL / MRK / TOP / l10n` 포함
          - 기존 설정과 모드 순서를 보존하는 `openmw.cfg` 자동 갱신
          - 이전 한국어 패치 폴더/엔진 자동 백업

          ## 영상 자막 추가
          - OpenMW 0.51.0 영상 재생기에 외부 UTF-8 SRT 지원 추가
          - 영상과 같은 이름의 SRT를 VFS에서 자동 탐색
          - 본편 영상 3개: `mw_intro`, `mw_cavern`, `mw_end`
          - Bloodmoon 영상 7개: `bm_bearhunt1`, `bm_bearhunt2`, `bm_ceremony1`, `bm_ceremony2`, `bm_endgame`, `bm_frostgiant1`, `bm_frostgiant2`
          - 원본 BIK 영상은 수정하거나 재배포하지 않음
          - 자막이 없는 영상은 기존 OpenMW와 동일하게 재생

          ## 설치
          1. 공식 OpenMW 0.51.0을 설치하고 한 번 실행합니다.
          2. 이 릴리즈의 `Morrowind-Korean-OpenMW-0.51.0-KR2-Full.zip`을 압축 해제합니다.
          3. `Install-Korean.bat`을 실행합니다.

          전역 `encoding=utf8` 설정은 필요하지 않습니다.
          EOF
          sed -i 's/^          //' out/release-notes.md

          gh release upload "$TAG" "out/$ASSET" "out/$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenMW 0.51.0 Korean Support KR2" --notes-file out/release-notes.md

      - name: Verify published KR2 asset
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(cut -d' ' -f1 "out/$ASSET.sha256")
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | [.name, .size, .digest] | @tsv'
          remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == env.ASSET) | .digest')
          test "$remote_digest" = "sha256:$local_sha"
          echo "Published $ASSET with $remote_digest"

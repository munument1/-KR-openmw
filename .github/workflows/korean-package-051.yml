# Publish KR4 by repacking the validated KR3 payload with Galmuri11 (installer fix)
name: Korean 0.51 KR4 Galmuri11 release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/korean-package-051.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_TAG: "openmw-0.51.0-kr3"
  BASE_ASSET: "Morrowind-Korean-OpenMW-0.51.0-KR3-Full.zip"
  BASE_SHA256: "b678745854ae6787ba9c317802639f78853f5e786b7d773d05a5d4a02b622751"
  TAG: "openmw-0.51.0-kr4"
  PACKAGE_NAME: "Morrowind-Korean-OpenMW-0.51.0-KR4-Full.zip"

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download validated KR3 package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work stage dist
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BASE_ASSET" --dir work --clobber
          echo "$BASE_SHA256  work/$BASE_ASSET" | sha256sum -c -
          unzip -q "work/$BASE_ASSET" -d stage

      - name: Restore Galmuri11 font payload
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t font_dirs < <(find stage -type d -path '*/resources/vfs/fonts' | sort)
          test "${#font_dirs[@]}" -gt 0

          for font_dir in "${font_dirs[@]}"; do
            rm -f "$font_dir/GowunBatang-Bold.ttf" "$font_dir/GowunBatang-OFL.txt"
            cp files/data/fonts/Galmuri11.ttf "$font_dir/Galmuri11.ttf"
            cp files/data/fonts/Galmuri11-OFL-1.1.md "$font_dir/Galmuri11-OFL-1.1.md"
            cp files/data/fonts/MysticCards.omwfont "$font_dir/MysticCards.omwfont"
            cp files/data/fonts/DejaVuLGCSansMono.omwfont "$font_dir/DejaVuLGCSansMono.omwfont"
          done

          cp packaging/korean/install-korean.ps1 stage/install-korean.ps1

          if [ -f stage/README-KOREAN.txt ]; then
            sed -i 's/Gowun Batang Bold/Galmuri11/g; s/Gowun Batang/Galmuri11/g' stage/README-KOREAN.txt
          fi

          cat > stage/FONT-ROLLBACK.txt <<'EOF'
          OpenMW Korean KR4 font rollback
          - Korean UI font: Galmuri11
          - MysticCards: Galmuri11.ttf, antialias=false, resolution=70
          - DejaVuLGCSansMono slot: Galmuri11.ttf, antialias=false, resolution=58
          - DemonicLetters: unchanged
          - Base runtime/translation payload: validated KR3
          EOF
          sed -i 's/^          //' stage/FONT-ROLLBACK.txt

      - name: Validate Galmuri11 package
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t mystic_files < <(find stage -type f -path '*/resources/vfs/fonts/MysticCards.omwfont' | sort)
          mapfile -t mono_files < <(find stage -type f -path '*/resources/vfs/fonts/DejaVuLGCSansMono.omwfont' | sort)
          test "${#mystic_files[@]}" -gt 0
          test "${#mono_files[@]}" -gt 0

          for f in "${mystic_files[@]}"; do
            grep -Fq 'Source" value="Galmuri11.ttf"' "$f"
            grep -Fq 'Antialias" value="false"' "$f"
            grep -Fq 'Resolution" value="70"' "$f"
          done
          for f in "${mono_files[@]}"; do
            grep -Fq 'Source" value="Galmuri11.ttf"' "$f"
            grep -Fq 'Antialias" value="false"' "$f"
            grep -Fq 'Resolution" value="58"' "$f"
          done

          while IFS= read -r font_dir; do
            test -s "$font_dir/Galmuri11.ttf"
            test -s "$font_dir/Galmuri11-OFL-1.1.md"
          done < <(find stage -type d -path '*/resources/vfs/fonts' | sort)

          ! find stage -type f -name 'GowunBatang*' | grep -q .
          ! grep -RIl 'GowunBatang-Bold.ttf' stage | grep -q .
          grep -Fq 'resources\vfs\fonts\Galmuri11.ttf' stage/install-korean.ps1
          pwsh -NoLogo -NoProfile -Command "[scriptblock]::Create([IO.File]::ReadAllText('stage/install-korean.ps1')) | Out-Null"

      - name: Create KR4 archive
        shell: bash
        run: |
          set -euo pipefail
          (cd stage && zip -qr -9 "../dist/$PACKAGE_NAME" .)
          (cd dist && sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256")
          unzip -tq "dist/$PACKAGE_NAME"
          cat "dist/$PACKAGE_NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-windows-openmw-0.51.0-kr4-galmuri11
          path: |
            dist/${{ env.PACKAGE_NAME }}
            dist/${{ env.PACKAGE_NAME }}.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish or replace KR4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<'EOF'
          # OpenMW 0.51.0 Korean Support KR4

          KR3의 검증된 한국어 엔진/번역/영상 자막 구성은 유지하고, 한국어 UI 폰트를 **갈무리11(Galmuri11)** 로 되돌린 릴리즈입니다.

          ## KR4 변경
          - `MysticCards` → `Galmuri11.ttf`, 안티앨리어싱 끔, 해상도 70
          - `DejaVuLGCSansMono` 슬롯 → `Galmuri11.ttf`, 안티앨리어싱 끔, 해상도 58
          - `DemonicLetters` 데이드릭 글꼴은 기존 그대로 유지
          - Gowun Batang 폰트 파일과 라이선스는 패키지에서 제거
          - 기존 KR3의 `openmw.exe`, 번역 ESP/CEL/MRK/TOP/l10n, 영상 SRT 구성은 유지
          - KR3 경량 패키지 구조(`payload/openmw.exe`, `payload/resources`)에 맞는 설치기로 교정

          기존 KR3 사용자는 KR4를 설치하면 관리 대상 엔진/폰트 파일과 한국어 모드가 백업된 뒤 갈무리11 기준으로 갱신됩니다.
          EOF
          sed -i 's/^          //' dist/release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$PACKAGE_NAME" "dist/$PACKAGE_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "${GITHUB_SHA}" --title "OpenMW 0.51.0 Korean Support KR4" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "${GITHUB_SHA}" --title "OpenMW 0.51.0 Korean Support KR4" --notes-file dist/release-notes.md "dist/$PACKAGE_NAME" "dist/$PACKAGE_NAME.sha256"
          fi
